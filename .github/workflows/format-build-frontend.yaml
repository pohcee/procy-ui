name: UI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: "Format & Build Ui"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Lint Ui
        run: yarn lint

      - name: Typecheck Ui
        run: yarn typecheck

      - name: Test Ui
        run: yarn test

      - name: Build Ui
        run: yarn generate
